services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brewlite
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brewlite-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brewlite?schema=public
      JWT_SECRET: brewlite_jwt_secret_key_2026
    volumes:
      - ./apps/api/uploads:/app/uploads   # Mount trực tiếp folder uploads từ máy vào container
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brewlite-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: brewlite-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - api
    networks:
      - brewlite-net

volumes:
  postgres_data:
  uploads_data:   # Khai báo volume lưu trữ ảnh upload

networks:
  brewlite-net:
    driver: bridge